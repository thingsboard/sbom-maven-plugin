version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
    groups:
      maven:
        patterns:
          - "*"
    ignore:
      - dependency-name: "org.apache.maven:*"
      - dependency-name: "org.codehaus.mojo:flatten-maven-plugin"
        versions:
          - ">= 1.9.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
