name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B install
      - name: Check that a rebuild produces identical artifacts
        run: mvn -B clean verify artifact:compare -DskipTests -Dinvoker.skip
      - name: Keep the locally installed plugin out of the Maven cache
        if: always()
        run: rm -rf ~/.m2/repository/org/thingsboard/sbom-maven-plugin
