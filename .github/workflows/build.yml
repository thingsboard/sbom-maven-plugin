name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.java }}${{ matrix.maven && format(', Maven {0}', matrix.maven) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            rebuild: true
          - java: '25'
          # The oldest Maven the plugin supports (see maven-api.version in pom.xml)
          - java: '17'
            maven: '3.8.7'
            # SHA-256 of apache-maven-3.8.7-bin.zip, checked against the SHA-512 Apache publishes
            maven-sha256: '70f7fec785728560e5382f1f17fbd8d9dfab391bf87b29cad1a60e54e60b2a7a'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Switch the Maven Wrapper to Maven ${{ matrix.maven }}
        if: matrix.maven
        run: ./mvnw -B -ntp -q wrapper:wrapper -Dmaven=${{ matrix.maven }} -DdistributionSha256Sum=${{ matrix.maven-sha256 }}
      - run: ./mvnw -B -ntp -V install
      - name: Check that a rebuild produces identical artifacts
        if: matrix.rebuild
        run: ./mvnw -B -ntp clean verify artifact:compare -DskipTests -DskipITs -Dinvoker.skip
      - name: Upload the test reports and integration test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java-${{ matrix.java }}${{ matrix.maven && format('-maven-{0}', matrix.maven) || '' }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/it/*/build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the locally installed plugin out of the Maven cache
        if: always()
        run: rm -rf ~/.m2/repository/org/thingsboard/sbom-maven-plugin

  ci:
    name: CI
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.build.result }}" = success
