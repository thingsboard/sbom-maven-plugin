name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.java }}${{ matrix.maven && format(', Maven {0}', matrix.maven) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '25'
            rebuild: true
          # The oldest Maven the plugin supports (see maven-api.version in pom.xml)
          - java: '17'
            maven: '3.8.7'
            # SHA-256 of apache-maven-3.8.7-bin.zip, checked against the SHA-512 Apache publishes
            maven-sha256: '70f7fec785728560e5382f1f17fbd8d9dfab391bf87b29cad1a60e54e60b2a7a'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-read-only: ${{ !matrix.rebuild }}
      - name: Switch the Maven Wrapper to Maven ${{ matrix.maven }}
        if: matrix.maven
        run: ./mvnw -B -ntp -q wrapper:wrapper -Dmaven=${{ matrix.maven }} -DdistributionSha256Sum=${{ matrix.maven-sha256 }}
      # RegistryImageIT runs the tools of the image goal for real: it pushes a two-architecture image to a registry in Docker
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builder reaches the test registry on localhost
          driver-opts: network=host
      - name: Install syft and oras
        env:
          SYFT_VERSION: 1.57.1
          SYFT_SHA256: bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c
          ORAS_VERSION: 1.3.6
          ORAS_SHA256: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
        run: |
          fetch() { # tool, URL and SHA-256 of its linux_amd64 archive
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$1.tar.gz" "$2"
            echo "$3  $RUNNER_TEMP/$1.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/$1.tar.gz" -C "$HOME/.local/bin" "$1"
          }
          mkdir -p "$HOME/.local/bin"
          fetch syft "https://github.com/anchore/syft/releases/download/v$SYFT_VERSION/syft_${SYFT_VERSION}_linux_amd64.tar.gz" "$SYFT_SHA256"
          fetch oras "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/oras_${ORAS_VERSION}_linux_amd64.tar.gz" "$ORAS_SHA256"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and test
        run: ./mvnw -B -ntp -V install 2>&1 | tee "$RUNNER_TEMP/build.log"
        timeout-minutes: 15
      - name: Check that a rebuild produces identical artifacts
        if: matrix.rebuild
        env:
          TZ: Pacific/Kiritimati
          LC_ALL: C
          MAVEN_OPTS: -Duser.language=tr -Duser.country=TR
        run: ./mvnw -B -ntp clean verify artifact:compare -DskipTests -DskipITs -Dinvoker.skip 2>&1 | tee "$RUNNER_TEMP/rebuild.log"
      - name: Add the build errors to the job summary
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            cat "$RUNNER_TEMP"/build.log "$RUNNER_TEMP"/rebuild.log 2>/dev/null | grep -m 200 '^\[ERROR\]' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the test reports and integration test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java-${{ matrix.java }}${{ matrix.maven && format('-maven-{0}', matrix.maven) || '' }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/it/*/build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the locally installed plugin out of the Maven cache
        if: always()
        run: rm -rf ~/.m2/repository/org/thingsboard/sbom-maven-plugin

  ci:
    name: CI
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.build.result }}" = success
